name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tailwind offline
        run: |
          curl -fsSL https://cdn.tailwindcss.com/3.4.17 -o www/tailwind.js && sed -i 's#https://cdn.tailwindcss.com/3.4.17#tailwind.js#' www/index.html || echo "keeping CDN"
      - run: npm install
      - run: npx cap add android
      - name: Icons and keep screen on
        run: |
          pip install pillow
          python3 scripts/prep_android.py
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
