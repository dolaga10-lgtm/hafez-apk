<!-- ===================== COMPLETE UPGRADE PATCH (DRAIN MAGNET + SMART L-BEAM + WALL HEIGHTS + CLOSE LOOP + FULL EN I18N) ===================== -->
<script>
(function () {
  const cv = document.getElementById('previewCanvas');
  if (!cv) return;

  // =========================================================================
  // 1. تنظيف وتصغير القائمة المنسدلة العلوية + نقل ارتفاع السقف + ارتفاع كل حائط + زر قفل المضلع
  // =========================================================================
  function upgradeHeaderAndMenus() {
    // إخفاء الأزرار غير المطلوبة من قائمة (☰) لتصغيرها ولمّها لفوق
    ['tabBtnSurvey', 'tabBtnSpanBeams', 'tabBtnTriangle', 'tabBtnGuide'].forEach((id) => {
      const btn = document.getElementById(id);
      if (btn) btn.style.display = 'none';
    });

    // إخفاء خانة ارتفاع السقف القديمة من قائمة (☰) بعد نقلها للشريط الرئيسي
    const oldCeilInp = document.getElementById('inpCeilingHeight');
    if (oldCeilInp && oldCeilInp.parentElement) {
      oldCeilInp.parentElement.style.display = 'none';
    }

    // تصغير المسافات داخل القائمة العلوية
    const topMoreDrawer = document.getElementById('topMoreDrawer');
    if (topMoreDrawer) {
      topMoreDrawer.classList.remove('space-y-2', 'p-2.5');
      topMoreDrawer.classList.add('p-1.5', 'space-y-1');
    }

    // إضافة شريط التحكم السريع بارتفاع الحائط الحالي + ارتفاع السقف العام + زر قفل الحائط الأخير بجوار "+ إضافة حائط جديد"
    const addWallBtn = document.getElementById('btnAddWall');
    if (addWallBtn && !document.getElementById('wallQuickHeightsCluster')) {
      const parentBar = addWallBtn.parentElement;
      parentBar.classList.add('flex-wrap');

      const cluster = document.createElement('div');
      cluster.id = 'wallQuickHeightsCluster';
      cluster.className = 'flex items-center gap-1 flex-wrap';
      cluster.innerHTML = `
        <div class="flex items-center gap-1 theme-sub border border-amber-500/50 rounded-xl px-2 py-0.5 text-[11px]" title="تعديل ارتفاع الحائط المحدد حالياً لوحده">
          <span id="lblActiveWallHeightTag" class="font-extrabold text-amber-400">ارتفاع ح#1:</span>
          <input id="inpActiveWallCustomHeight" type="number" min="30" max="600" step="1" value="285" class="theme-input border border-amber-500/60 rounded-lg px-1 py-0.5 text-xs font-black text-amber-400 w-14 text-center">
          <span class="text-[10px] opacity-75" data-unit-lbl="cm">سم</span>
        </div>
        <div class="flex items-center gap-1 theme-sub border border-sky-500/40 rounded-xl px-2 py-0.5 text-[11px]" title="ارتفاع السقف العام لجميع الحوائط">
          <span id="lblGlobalCeilTag" class="font-extrabold text-sky-400">السقف:</span>
          <input id="inpQuickGlobalCeiling" type="number" min="150" max="600" step="1" value="${state.ceilingHeight || 285}" class="theme-input border border-sky-500/50 rounded-lg px-1 py-0.5 text-xs font-black text-sky-400 w-14 text-center">
          <span class="text-[10px] opacity-75" data-unit-lbl="cm">سم</span>
        </div>
        <button id="btnCloseLastWallLoop" type="button" class="px-2.5 py-1 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-[11px] font-black whitespace-nowrap shadow transition" title="تقفيل الحائط الأخير ليلمس بداية الحائط الأول تلقائياً">
          🔗 قفل الحائط الأخير
        </button>
      `;
      parentBar.insertBefore(cluster, addWallBtn);

      // ربط تغيير ارتفاع الحائط المحدد لوحده
      const inpWallH = document.getElementById('inpActiveWallCustomHeight');
      inpWallH.addEventListener('input', (e) => {
        const w = state.walls[state.activeWallIndex];
        if (!w) return;
        const val = Math.max(30, parseFloat(e.target.value) || state.ceilingHeight || 285);
        w.customHeight = val;
        if (w.isBarWall) w.barHeight = val;
        renderWallTabs();
        renderCanvas();
      });

      // ربط تغيير ارتفاع السقف العام
      const inpGlobalCeil = document.getElementById('inpQuickGlobalCeiling');
      inpGlobalCeil.addEventListener('input', (e) => {
        const oldCeil = state.ceilingHeight || 285;
        const nextCeil = Math.max(150, parseFloat(e.target.value) || 285);
        state.ceilingHeight = nextCeil;
        if (oldCeilInp) oldCeilInp.value = nextCeil;
        // تحديث الحوائط التي لم يُخصص لها ارتفاع منفصل
        state.walls.forEach((w) => {
          if (!w.customHeight || w.customHeight === oldCeil) {
            w.customHeight = nextCeil;
          }
        });
        syncUI();
      });

      // ربط زر قفل الحائط الأخير مع بداية الحائط الأول
      document.getElementById('btnCloseLastWallLoop').addEventListener('click', () => {
        closePolygonLoopAutomatically();
      });
    }
  }

  // دالة مساعدة لمعرفة ارتفاع أي حائط على حدة
  window.getWallHeightCm = function (w) {
    if (!w) return parseFloat(state.ceilingHeight) || 285;
    if (w.isBarWall) return Math.min(parseFloat(state.ceilingHeight) || 285, parseFloat(w.barHeight) || 110);
    if (w.customHeight && parseFloat(w.customHeight) > 0) return parseFloat(w.customHeight);
    return parseFloat(state.ceilingHeight) || 285;
  };

  // دالة قفل الحائط الأخير على الضلع الأول بالزاوية والطول المضبوطين
  window.closePolygonLoopAutomatically = function () {
    if (state.walls.length < 3) {
      if (window.showAppToast) showAppToast(isEn() ? 'Add at least 3 walls to close the room' : 'أضف 3 حوائط على الأقل لتقفيل الغرفة', 'warn');
      return;
    }
    const { segments, closureGap } = computeWallGeometry();
    if (closureGap <= 1.0) {
      if (window.showAppToast) showAppToast(isEn() ? 'Walls are already closed!' : 'الحوائط مقفولة ومضبوطة بالفعل ✓', 'ok');
      return;
    }

    const lastIdx = state.walls.length - 1;
    const prevSeg = segments[lastIdx - 1];
    const lastWall = state.walls[lastIdx];

    // النقطة الحالية قبل الضلع الأخير هي (prevSeg.x2, prevSeg.y2) ونريد توصيلها بنقطة الأصل (0,0)
    const dx = 0 - prevSeg.x2;
    const dy = 0 - prevSeg.y2;
    const neededLen = Math.hypot(dx, dy);

    if (neededLen < 10) {
      if (window.showAppToast) showAppToast(isEn() ? 'Endpoint is already touching the start!' : 'نهاية الحائط ملامسة للبداية بالفعل ✓', 'ok');
      return;
    }

    const targetHeadingDeg = (Math.atan2(dy, dx) * 180) / Math.PI;
    let turnDeg = (targetHeadingDeg - prevSeg.headingDeg) % 360;
    if (turnDeg > 180) turnDeg -= 360;
    if (turnDeg < -180) turnDeg += 360;

    lastWall.length = Math.round(neededLen * 10) / 10;
    if (Math.abs(turnDeg - 90) < 1.5) {
      lastWall.turn = 'right90';
      lastWall.angle = 90;
    } else if (Math.abs(turnDeg + 90) < 1.5) {
      lastWall.turn = 'left90';
      lastWall.angle = 90;
    } else if (Math.abs(turnDeg) < 1.5) {
      lastWall.turn = 'straight';
      lastWall.angle = 180;
    } else {
      lastWall.turn = 'custom';
      lastWall.angle = Math.round((180 - turnDeg) * 10) / 10;
    }

    state.activeWallIndex = lastIdx;
    syncUI();
    if (window.showAppToast) {
      showAppToast(
        isEn()
          ? `Closed Wall #${lastIdx + 1} (${lastWall.length} cm) to Wall #1 ✓`
          : `تم قفل الحائط #${lastIdx + 1} بطول ${lastWall.length} سم مع بداية الحائط #1 ✓`,
        'ok'
      );
    }
  };

  // =========================================================================
  // 2. مغناطيس تثبيت البلاعة الأرضية (منع رعشة اليد وتثبيت الطول عند تحريك العرض)
  // =========================================================================
  let drainDragState = null;

  function getCanvasCoordsLocal(e) {
    const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    const r = cv.getBoundingClientRect();
    return {
      cx: (t.clientX - r.left) * (cv.width / r.width),
      cy: (t.clientY - r.top) * (cv.height / r.height)
    };
  }

  function findDrainHit(cx, cy) {
    if (!lastPlanScale || !Array.isArray(state.floorItems)) return null;
    const P = lastPlanScale;
    const sel = state.floorItems.find((x) => x.id === state.selDrain);
    if (sel) {
      const [sx, sy] = P.toScreen(sel.x, sel.y);
      const r = Math.max(7, (sel.d / 2) * P.scale);
      const [mx, my] = P.toScreen(P.roomMidX, P.roomMidY);
      let dx = mx - sx, dy = my - sy;
      const L = Math.hypot(dx, dy);
      if (L < 14) { dx = 0.7071; dy = 0.7071; } else { dx /= L; dy /= L; }
      const D = r + 52;
      const hx = Math.max(26, Math.min(cv.width - 26, sx + dx * D));
      const hy = Math.max(58, Math.min(cv.height - 60, sy + dy * D));
      const delx = Math.max(22, Math.min(cv.width - 22, hx - dy * 46));
      const dely = Math.max(54, Math.min(cv.height - 56, hy + dx * 46));
      if (Math.hypot(cx - hx, cy - hy) <= 32) return { f: sel, kind: 'handle' };
      if (Math.hypot(cx - delx, cy - dely) <= 22) return { f: sel, kind: 'del' };
    }
    for (let i = state.floorItems.length - 1; i >= 0; i--) {
      const f = state.floorItems[i];
      const [sx, sy] = P.toScreen(f.x, f.y);
      const r = Math.max(7, (f.d / 2) * P.scale);
      if (Math.hypot(cx - sx, cy - sy) <= r + 18) return { f, kind: 'body' };
    }
    return null;
  }

  // اعتراض حركة البلاعة في مرحلة Capture لتطبيق المغناطيس ومنع الرعشة
  cv.addEventListener('pointerdown', (e) => {
    if (state.previewMode !== 'plan' || !lastPlanScale) return;
    const { cx, cy } = getCanvasCoordsLocal(e);

    // فحص مقبض تفريع الكمر لحرف L أولاً (قبل البلاعة)
    if (checkBeamLBranchDown(cx, cy, e)) return;

    // فحص الضغط على نقطة قفل الحائط الأخير على المسقط الأفقي
    if (checkPlanCloseLoopChipDown(cx, cy, e)) return;

    if (state.tool && state.tool !== 'drain') return;
    const hit = findDrainHit(cx, cy);
    if (hit) {
      e.stopImmediatePropagation();
      e.preventDefault();
      if (hit.kind === 'del') {
        state.floorItems = state.floorItems.filter((x) => x.id !== hit.f.id);
        state.selDrain = null;
        syncUI();
        return;
      }
      state.selDrain = hit.f.id;
      drainDragState = {
        f: hit.f,
        startX: cx,
        startY: cy,
        smoothX: cx,
        smoothY: cy,
        lastX: cx,
        lastY: cy,
        anchorX: cx,
        anchorY: cy,
        origModelX: hit.f.x,
        origModelY: hit.f.y,
        baseModelX: hit.f.x,
        baseModelY: hit.f.y,
        primaryAxis: null, // 'h' تثبيت الرأسي | 'v' تثبيت الأفقي
        isNew: false
      };
      renderCanvas();
      return;
    }

    if (state.tool === 'drain') {
      e.stopImmediatePropagation();
      e.preventDefault();
      const [mx, my] = lastPlanScale.toModel(cx, cy);
      const f = { id: Date.now(), x: +mx.toFixed(1), y: +my.toFixed(1), d: 10 };
      state.floorItems.push(f);
      state.selDrain = f.id;
      drainDragState = {
        f,
        startX: cx,
        startY: cy,
        smoothX: cx,
        smoothY: cy,
        lastX: cx,
        lastY: cy,
        anchorX: cx,
        anchorY: cy,
        origModelX: f.x,
        origModelY: f.y,
        baseModelX: f.x,
        baseModelY: f.y,
        primaryAxis: null,
        isNew: true
      };
      renderCanvas();
    }
  }, true);

  window.addEventListener('pointermove', (e) => {
    if (!drainDragState || !lastPlanScale) return;
    e.stopImmediatePropagation();
    const { cx, cy } = getCanvasCoordsLocal(e);
    const P = lastPlanScale;
    const d = drainDragState;

    // تنعيم حركة اليد (EMA) لمنع اهتزاز الأرقام
    d.smoothX = d.smoothX * 0.45 + cx * 0.55;
    d.smoothY = d.smoothY * 0.45 + cy * 0.55;

    const totalDxPx = d.smoothX - d.startX;
    const totalDyPx = d.smoothY - d.startY;

    // منطقة أمان ضد الرعشة (7px)
    if (!d.primaryAxis && Math.hypot(totalDxPx, totalDyPx) < 7) return;

    const magLevel = (state.settings && state.settings.magnetStrength) || 'strong';
    const breakoutPx = magLevel === 'light' ? 24 : (magLevel === 'medium' ? 38 : 54);

    if (!d.primaryAxis) {
      d.primaryAxis = Math.abs(totalDxPx) >= Math.abs(totalDyPx) ? 'h' : 'v';
      d.anchorX = d.smoothX;
      d.anchorY = d.smoothY;
      d.baseModelX = d.origModelX;
      d.baseModelY = d.origModelY;
    }

    const stepDxPx = Math.abs(d.smoothX - d.lastX);
    const stepDyPx = Math.abs(d.smoothY - d.lastY);
    d.lastX = d.smoothX;
    d.lastY = d.smoothY;

    const snapOn = state.settings ? state.settings.enableSnap !== false : true;
    const sStep = snapOn ? (parseFloat(state.settings?.snapStep) || 1) : 0.5;
    const snapFn = (v) => Math.round(v / sStep) * sStep;

    if (d.primaryAxis === 'h') {
      // تحريك بالعرض فقط -> الطول (Y) مقفول بالمغناطيس تماماً
      const dxCm = (d.smoothX - d.anchorX) / P.scale;
      d.f.x = +Math.max(P.minX, Math.min(P.maxX, snapFn(d.baseModelX + dxCm))).toFixed(1);
      d.f.y = d.baseModelY;

      if (stepDxPx > stepDyPx && Math.abs(d.smoothY - d.anchorY) < breakoutPx * 0.65) {
        d.anchorY = d.anchorY * 0.9 + d.smoothY * 0.1;
      }
      if (Math.abs(d.smoothY - d.anchorY) >= breakoutPx) {
        d.primaryAxis = 'v';
        d.anchorY = d.smoothY;
        d.baseModelY = d.f.y;
        d.anchorX = d.smoothX;
        d.baseModelX = d.f.x;
      }
    } else {
      // تحريك بالطول فقط -> العرض (X) مقفول بالمغناطيس تماماً
      const dyCm = (d.smoothY - d.anchorY) / P.scale;
      d.f.y = +Math.max(P.minY, Math.min(P.maxY, snapFn(d.baseModelY + dyCm))).toFixed(1);
      d.f.x = d.baseModelX;

      if (stepDyPx > stepDxPx && Math.abs(d.smoothX - d.anchorX) < breakoutPx * 0.65) {
        d.anchorX = d.anchorX * 0.9 + d.smoothX * 0.1;
      }
      if (Math.abs(d.smoothX - d.anchorX) >= breakoutPx) {
        d.primaryAxis = 'h';
        d.anchorX = d.smoothX;
        d.baseModelX = d.f.x;
        d.anchorY = d.smoothY;
        d.baseModelY = d.f.y;
      }
    }

    renderCanvas();
  }, true);

  const endDrainDrag = () => {
    if (!drainDragState) return;
    const wasNew = drainDragState.isNew;
    drainDragState = null;
    if (wasNew && state.tool === 'drain') setTool(null);
    syncUI();
  };
  window.addEventListener('pointerup', endDrainDrag, true);
  window.addEventListener('pointercancel', endDrainDrag, true);

  // منع أحداث الماوس/التاتش القديمة من تحريك البلاعة بدون مغناطيس
  ['mousedown', 'touchstart'].forEach((evName) => {
    cv.addEventListener(evName, (e) => {
      if (drainDragState) e.stopImmediatePropagation();
    }, true);
  });

  // =========================================================================
  // 3. الكمر الذكي في المسقط الأفقي:
  //    - إظهار المسافة يمين وشمال على أي حائط يلمسه الكمر أثناء التحريك
  //    - إظهار طول الكمر لحظياً أثناء المط أو السحب
  //    - مقبض تفريع (📐 حرف L) على طرف الكمر لسحب كمر ثانٍ مباشرة باللمس
  //    - عرض الحائط الملامس واتجاهاته في المسقط الأفقي
  // =========================================================================
  let beamLHandleBoxes = [];
  let planCloseLoopChipBox = null;

  function getWallTouchInfoForPoint(px, py, beamWidth, segments) {
    let best = null;
    for (const seg of segments) {
      const cp = closestPointOnSegment(px, py, seg.x1, seg.y1, seg.x2, seg.y2);
      if (cp.dist <= 24) {
        const bw = parseFloat(beamWidth) || 15;
        const leftCm = Math.round(Math.max(0, Math.min(seg.wall.length - bw, cp.offsetCm - bw / 2)));
        const rightCm = Math.round(Math.max(0, seg.wall.length - leftCm - bw));
        // معرفة اتجاه الحائط في المسقط الأفقي (أعلى / أسفل / يمين / شمال)
        const deg = ((seg.headingDeg % 360) + 360) % 360;
        let dirAr = 'أفقي', dirEn = 'Horizontal';
        if (deg >= 45 && deg < 135) { dirAr = 'رأسي (يمين)'; dirEn = 'Vertical (Right)'; }
        else if (deg >= 135 && deg < 225) { dirAr = 'أفقي (أسفل)'; dirEn = 'Horizontal (Bottom)'; }
        else if (deg >= 225 && deg < 315) { dirAr = 'رأسي (شمال)'; dirEn = 'Vertical (Left)'; }
        else { dirAr = 'أفقي (أعلى)'; dirEn = 'Horizontal (Top)'; }

        if (!best || cp.dist < best.dist) {
          best = {
            wallIndex: seg.index,
            wallLen: seg.wall.length,
            leftCm,
            rightCm,
            dist: cp.dist,
            contactX: cp.x,
            contactY: cp.y,
            seg,
            dirLabel: isEn() ? dirEn : dirAr
          };
        }
      }
    }
    return best;
  }

  function checkBeamLBranchDown(cx, cy, e) {
    if (!lastPlanScale || !beamLHandleBoxes.length) return false;
    for (const h of beamLHandleBoxes) {
      if (Math.hypot(cx - h.sx, cy - h.sy) <= 22) {
        e.stopImmediatePropagation();
        e.preventDefault();
        const parentSb = state.spanBeams.find((b) => b.id === h.beamId);
        const newBeam = {
          id: Date.now() + Math.floor(Math.random() * 999),
          mode: 'free',
          x1: Math.round(h.modelX),
          y1: Math.round(h.modelY),
          x2: Math.round(h.modelX + 15),
          y2: Math.round(h.modelY + 15),
          drop: parentSb ? parentSb.drop : 25,
          width: parentSb ? parentSb.width : 15,
          locked: false,
          parentBeamId: h.beamId
        };
        state.spanBeams.push(newBeam);
        state.selectedSpanBeamId = newBeam.id;
        state.activeSelectionKind = 'spanBeam';
        dragState = {
          mode: 'freeBeamDrawEnd',
          sb: newBeam,
          anchorPt: { x: newBeam.x1, y: newBeam.y1 },
          isNew: true
        };
        dragCursor = { cx, cy };
        renderCanvas();
        return true;
      }
    }
    return false;
  }

  function checkPlanCloseLoopChipDown(cx, cy, e) {
    if (!planCloseLoopChipBox) return false;
    const b = planCloseLoopChipBox;
    if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) {
      e.stopImmediatePropagation();
      e.preventDefault();
      closePolygonLoopAutomatically();
      return true;
    }
    return false;
  }

  // رسم تفاصيل الكمر الحية (المسافات يمين وشمال على الحائط الملامس + الطول أثناء المط + زر سحب حرف L)
  function drawSmartPlanEnhancements(ctx, W, H) {
    beamLHandleBoxes = [];
    planCloseLoopChipBox = null;

    // رسم خط القفل في حال سحب البلاعة بالمغناطيس
    if (drainDragState && lastPlanScale && drainDragState.primaryAxis) {
      const P = lastPlanScale;
      const [sx, sy] = P.toScreen(drainDragState.f.x, drainDragState.f.y);
      ctx.save();
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      if (drainDragState.primaryAxis === 'h') {
        ctx.moveTo(20, sy);
        ctx.lineTo(W - 20, sy);
      } else {
        ctx.moveTo(sx, 40);
        ctx.lineTo(sx, H - 40);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    if (state.previewMode !== 'plan' || !lastPlanScale) return;
    const P = lastPlanScale;
    const { segments, closureGap } = computeWallGeometry();

    // زر سريع على المسقط الأفقي لتقفيل الحائط الأخير مع الضلع الأول لو الغرفة مفتوحة
    if (segments.length >= 3 && closureGap > 2.0) {
      const lastSeg = segments[segments.length - 1];
      const [lx, ly] = P.toScreen(lastSeg.x2, lastSeg.y2);
      const [fx, fy] = P.toScreen(0, 0);
      ctx.save();
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(fx, fy);
      ctx.stroke();
      ctx.setLineDash([]);

      const mx = (lx + fx) / 2, my = (ly + fy) / 2;
      const txt = isEn() ? `🔗 Tap to Close Wall #${segments.length}` : `🔗 اضغط لقفل حائط #${segments.length} على حائط #1`;
      ctx.font = '900 11px Cairo, sans-serif';
      const bw = Math.ceil(ctx.measureText(txt).width + 18), bh = 24;
      const bx = Math.max(8, Math.min(W - bw - 8, mx - bw / 2));
      const by = Math.max(46, Math.min(H - bh - 12, my - bh / 2));
      ctx.fillStyle = '#9333ea';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(txt, bx + bw / 2, by + 16);
      planCloseLoopChipBox = { x: bx, y: by, w: bw, h: bh };
      ctx.restore();
    }

    const sb = getActiveSpanBeam();
    if (!sb) return;
    const geom = computeSpanBeamGeometry(sb, segments);
    if (!geom) return;

    const [sx1, sy1] = P.toScreen(geom.pStartX, geom.pStartY);
    const [sx2, sy2] = P.toScreen(geom.pEndX, geom.pEndY);

    // 1. فحص تلامس طرفي الكمر مع أي حائط في المسقط وإظهار المسافة يمين وشمال على الحائط مباشرة
    const touchStart = getWallTouchInfoForPoint(geom.pStartX, geom.pStartY, geom.width, segments);
    const touchEnd = getWallTouchInfoForPoint(geom.pEndX, geom.pEndY, geom.width, segments);

    const drawWallSplitDistances = (touch, screenPt, isEndPt) => {
      if (!touch) return;
      const seg = touch.seg;
      const [wx1, wy1] = P.toScreen(seg.x1, seg.y1);
      const [wx2, wy2] = P.toScreen(seg.x2, seg.y2);

      ctx.save();
      // خط القياس على الحائط الملامس (يمين وشمال الكمر)
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(wx1, wy1);
      ctx.lineTo(screenPt[0], screenPt[1]);
      ctx.moveTo(screenPt[0], screenPt[1]);
      ctx.lineTo(wx2, wy2);
      ctx.stroke();

      const uLbl = (state.settings && state.settings.unit === 'mm') ? (isEn() ? 'mm' : 'مم') : (isEn() ? 'cm' : 'سم');
      const mult = (state.settings && state.settings.unit === 'mm') ? 10 : 1;
      const rVal = Math.round(touch.rightCm * mult);
      const lVal = Math.round(touch.leftCm * mult);

      const badgeTxt = isEn()
        ? `Wall #${touch.wallIndex + 1} (${touch.dirLabel}) ➔ Right: ${rVal}${uLbl} | Left: ${lVal}${uLbl}`
        : `حائط #${touch.wallIndex + 1} (${touch.dirLabel}) ⬅ يمينه: ${rVal} ${uLbl} | شماله: ${lVal} ${uLbl}`;

      ctx.font = '900 11px Cairo, sans-serif';
      const bw = Math.ceil(ctx.measureText(badgeTxt).width + 18);
      const bh = 22;
      const bx = Math.max(6, Math.min(W - bw - 6, screenPt[0] - bw / 2));
      const by = isEndPt
        ? Math.min(H - bh - 12, screenPt[1] + 16)
        : Math.max(48, screenPt[1] - bh - 16);

      ctx.fillStyle = '#0e7490';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(badgeTxt, bx + bw / 2, by + 15);
      ctx.restore();
    };

    drawWallSplitDistances(touchStart, [sx1, sy1], false);
    if (touchEnd && (!touchStart || touchEnd.wallIndex !== touchStart.wallIndex)) {
      drawWallSplitDistances(touchEnd, [sx2, sy2], true);
    }

    // 2. إظهار طول الكمر بشكل واضح ومستمر أثناء المط أو التحريك
    const midX = (sx1 + sx2) / 2;
    const midY = (sy1 + sy2) / 2;
    const uLbl = (state.settings && state.settings.unit === 'mm') ? (isEn() ? 'mm' : 'مم') : (isEn() ? 'cm' : 'سم');
    const mult = (state.settings && state.settings.unit === 'mm') ? 10 : 1;
    const lenDisp = Math.round(geom.actualLen * mult);

    ctx.save();
    const lenTxt = isEn() ? `📏 Beam Length: ${lenDisp} ${uLbl}` : `📏 طول الكمر: ${lenDisp} ${uLbl}`;
    ctx.font = '900 12px Cairo, sans-serif';
    const lw = Math.ceil(ctx.measureText(lenTxt).width + 18);
    const lh = 24;
    const lx = Math.max(8, Math.min(W - lw - 8, midX - lw / 2));
    const ly = Math.max(48, Math.min(H - lh - 14, midY + 14));
    ctx.fillStyle = '#059669';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(lx, ly, lw, lh, 7);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText(lenTxt, lx + lw / 2, ly + 16);
    ctx.restore();

    // 3. رسم مقبض تفريع (📐 شد حرف L) على طرف الكمر لسحب كمر ثانٍ مباشرة
    if (!sb.locked && !dragState) {
      // نضع مقبض التفريع بجانب الطرف الثاني للكمر (وفي منتصفه أيضاً) ليسهل سحب حرف L باللمس
      const perpX = -geom.dirY, perpY = geom.dirX;
      const lHandleScreenX = sx2 + perpX * 26;
      const lHandleScreenY = sy2 + perpY * 26;

      ctx.save();
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(sx2, sy2);
      ctx.lineTo(lHandleScreenX, lHandleScreenY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#9333ea';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(lHandleScreenX, lHandleScreenY, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 10px Cairo, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('L+', lHandleScreenX, lHandleScreenY + 4);
      ctx.restore();

      beamLHandleBoxes.push({
        beamId: sb.id,
        sx: lHandleScreenX,
        sy: lHandleScreenY,
        modelX: geom.pEndX,
        modelY: geom.pEndY
      });
    }
  }

  // =========================================================================
  // 4. تحديث رسم واجهة الحائط والـ 3D والـ Ruby ليقرأ ارتفاع كل حائط لوحده
  // =========================================================================
  function syncWallHeightUI() {
    const w = state.walls[state.activeWallIndex];
    if (!w) return;
    const wh = window.getWallHeightCm(w);
    const lblTag = document.getElementById('lblActiveWallHeightTag');
    const inpCustomH = document.getElementById('inpActiveWallCustomHeight');
    const inpGlobalCeil = document.getElementById('inpQuickGlobalCeiling');
    if (lblTag) {
      lblTag.textContent = isEn() ? `W#${state.activeWallIndex + 1} H:` : `ارتفاع ح#${state.activeWallIndex + 1}:`;
    }
    if (inpCustomH && document.activeElement !== inpCustomH) {
      inpCustomH.value = wh;
    }
    if (inpGlobalCeil && document.activeElement !== inpGlobalCeil) {
      inpGlobalCeil.value = state.ceilingHeight || 285;
    }

    // تحديث تبويبات الحوائط لتعرض مقاس وطول وارتفاع كل حائط بوضوح
    const tabs = document.querySelectorAll('#wallTabsContainer > button');
    tabs.forEach((btn, idx) => {
      const wallObj = state.walls[idx];
      if (!wallObj) return;
      const hVal = window.getWallHeightCm(wallObj);
      const isAct = idx === state.activeWallIndex;
      const barIcon = wallObj.isBarWall ? '🍹' : '';
      const wTitle = isEn() ? `Wall #${idx + 1}` : `حائط #${idx + 1}`;
      const uTxt = isEn() ? 'cm' : 'سم';
      btn.innerHTML = `<span>${wTitle} ${barIcon}</span><span class="px-1.5 py-0.2 rounded text-[10px] ${isAct ? 'bg-slate-950/20 text-slate-950 font-black' : 'bg-amber-500/15 text-amber-500'}">${wallObj.length}×${hVal}${uTxt}</span>`;
    });
  }

  // ربط توليد كود SketchUp ليدعم ارتفاع كل حائط المستقل
  const _origGenRuby = generateSketchUpRubyScript;
  generateSketchUpRubyScript = function () {
    const savedCeil = state.ceilingHeight;
    const savedBars = state.walls.map((w) => ({ isBarWall: w.isBarWall, barHeight: w.barHeight }));
    try {
      state.walls.forEach((w) => {
        const customH = window.getWallHeightCm(w);
        if (customH !== savedCeil) {
          w.isBarWall = true;
          w.barHeight = customH;
        }
      });
      return _origGenRuby.apply(this, arguments);
    } finally {
      state.walls.forEach((w, i) => {
        w.isBarWall = savedBars[i].isBarWall;
        w.barHeight = savedBars[i].barHeight;
      });
    }
  };

    if (!isEn()) return _origElLabel(el);
    const k = gasKind(el);
    if (k === 'meter') return 'Gas Meter';
    if (k === 'valve') return 'Gas Valve';
    if (k === 'hpipe') return 'Horiz. Gas Pipe';
    if (k === 'vpipe') return 'Vert. Gas Drop';
    return ELEMENT_LABEL_EN[el.type] || _origElLabel(el);
  };

  // ترجمة نصوص الـ Canvas تلقائياً عند التبديل للإنجليزية
  const canvasProto = CanvasRenderingContext2D.prototype;
  if (!canvasProto.__hzI18nPatched) {
    canvasProto.__hzI18nPatched = true;
    const _fillText = canvasProto.fillText;
    const _measureText = canvasProto.measureText;

    function translateCanvasString(str) {
      if (!isEn() || typeof str !== 'string') return str;
      let s = str;
      s = s.replace(/واجهة حائط #(\d+) \((\d+(?:\.\d+)?) سم × ارتفاع (\d+(?:\.\d+)?) سم\)/g, 'Wall #$1 Elevation ($2 cm × Height $3 cm)');
      s = s.replace(/⬅️ شمال \(حائط #(\d+)\)/g, '⬅️ Left (Wall #$1)');
      s = s.replace(/يمين \(حائط #(\d+)\) ➡️/g, 'Right (Wall #$1) ➡️');
      s = s.replace(/⬅️ من الشمال: ([\d.]+) (سم|مم)/g, '⬅️ From Left: $1 $2');
      s = s.replace(/من اليمين: ([\d.]+) (سم|مم) ➡️/g, 'From Right: $1 $2 ➡️');
      s = s.replace(/⬆️ من الأرض: ([\d.]+) (سم|مم)/g, '⬆️ From Floor: $1 $2');
      s = s.replace(/من اليمين: ([\d.]+) سم \| من الشمال: ([\d.]+) سم/g, 'Right: $1 cm | Left: $2 cm');
      s = s.replace(/من الأرض: ([\d.]+) سم \| من السقف: ([\d.]+) سم/g, 'Floor: $1 cm | Ceiling: $2 cm');
      s = s.replace(/المقاس: ([\d.]+)×([\d.]+) سم/g, 'Size: $1×$2 cm');
      s = s.replace(/🌉 طول الكمر: ([\d.]+) سم/g, '🌉 Beam Length: $1 cm');
      s = s.replace(/يمين: ([\d.]+) سم \| شمال: ([\d.]+) سم/g, 'Right: $1 cm | Left: $2 cm');
      s = s.replace(/سقوط: ([\d.]+) سم × عرض: ([\d.]+) سم/g, 'Drop: $1 cm × Width: $2 cm');
      s = s.replace(/كمر #(\d+): طول ([\d.]+)سم \(سقوط ([\d.]+)×عرض ([\d.]+)\)/g, 'Beam #$1: Len $2cm (Drop $3×W $4)');
      s = s.replace(/من اليمين: ([\d.]+)سم \| من الشمال: ([\d.]+)سم/g, 'Right: $1cm | Left: $2cm');
      s = s.replace(/شمال الكمر: ([\d.]+)سم/g, 'Left: $1cm');
      s = s.replace(/يمين الكمر: ([\d.]+)سم/g, 'Right: $1cm');
      s = s.replace(/ح(\d+) \(([\d.]+) (سم|مم)\)/g, 'W$1 ($2 $3)');
      s = s.replace(/([\d.]+) (سم|مم) من حائط (\d+)/g, '$1 $2 from Wall #$3');
      s = s.replace(/بلاعة أرضية/g, 'Floor Drain');
      s = s.replace(/منتصف الغرفة/g, 'Room Center');
      s = s.replace(/عمود بارز/g, 'Column');
      s = s.replace(/كمر ساقط بالحائط \(سقوط ([\d.]+) سم × بروز ([\d.]+) سم\)/g, 'Wall Beam (Drop $1 cm × Depth $2 cm)');
      s = s.replace(/🍹 فتحة بار \(([\d.]+)×([\d.]+)سم\)/g, '🍹 Bar Opening ($1×$2cm)');
      s = s.replace(/🍹 حائط بار منخفض \(ارتفاع ([\d.]+) سم\)/g, '🍹 Half / Bar Wall (Height $1 cm)');
      s = s.replace(/طول النزلة ([\d.]+) سم/g, 'Drop Length $1 cm');
      s = s.replace(/طول الماسورة ([\d.]+) سم/g, 'Pipe Length $1 cm');
      s = s.replace(/من الأرض ([\d.]+) سم/g, 'From Floor $1 cm');
      s = s.replace(/ماسورة رأسية/g, 'Vertical Pipe');
      s = s.replace(/⛔ داخل في: /g, '⛔ Overlapping: ');
      s = s.replace(/✅ لامس: /g, '✅ Touching: ');
      s = s.replace(/\bسم\b/g, 'cm');
      s = s.replace(/\bمم\b/g, 'mm');
      return s;
    }

    canvasProto.fillText = function (text, x, y, maxWidth) {
      const tr = translateCanvasString(String(text));
      if (maxWidth !== undefined) return _fillText.call(this, tr, x, y, maxWidth);
      return _fillText.call(this, tr, x, y);
    };
    canvasProto.measureText = function (text) {
      return _measureText.call(this, translateCanvasString(String(text)));
    };
  }

  function applyFullDomTranslation() {
    const en = isEn();
    const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    const textNodes = [];
    while (walk.nextNode()) textNodes.push(walk.currentNode);

    textNodes.forEach((node) => {
      const raw = node.nodeValue;
      if (!raw || !raw.trim()) return;
      const trimmed = raw.trim();
      for (const [arTxt, enTxt] of TEXT_PAIRS_AR_EN) {
        if (en && trimmed === arTxt) {
          node.nodeValue = raw.replace(arTxt, enTxt);
          break;
        } else if (!en && trimmed === enTxt) {
          node.nodeValue = raw.replace(enTxt, arTxt);
          break;
        }
      }
    });

    // ترجمة النصوص الديناميكية في الشريط العلوي والـ HUD
    const w = state.walls[state.activeWallIndex];
    if (w) {
      const topQuick = document.getElementById('lblTopWallQuick');
      if (topQuick) topQuick.textContent = en ? `W#${state.activeWallIndex + 1}: ${w.length}cm` : `ح#${state.activeWallIndex + 1}: ${w.length}سم`;
      const actTitle = document.getElementById('lblActiveWallTitle');
      if (actTitle) actTitle.textContent = en ? `Wall #${state.activeWallIndex + 1}:` : `حائط #${state.activeWallIndex + 1}:`;
      const elWallName = document.getElementById('lblElementsWallName');
      if (elWallName) elWallName.textContent = en ? `Wall #${state.activeWallIndex + 1}` : `حائط #${state.activeWallIndex + 1}`;
    }

    const hintEl = document.getElementById('canvasHintText');
    if (hintEl && !state.tool) {
      hintEl.textContent = state.previewMode === 'plan'
        ? (en ? '📐 Floor Plan: Drag beam, green ends, or L+ handle to branch an L-beam' : '📐 المسقط الأفقي: اسحب الكمر أو أطرافه الخضراء أو نقطة L+ لتفريع حرف L')
        : (en ? '👆 Tap any item to control or lock 🔒 — or tap ➕ to add items' : '👆 المس أي عنصر للتحكم به أو قفله 🔒 — أو اضغط ➕ لإدراج عنصر');
    }

    // ترجمة أزرار توصيل الكمر بالحوائط
    document.querySelectorAll('#planBeamConnectWallsStrip > button').forEach((b, idx) => {
      b.textContent = en ? `Connect to Wall #${idx + 1}` : `وصّل لحائط #${idx + 1}`;
    });

    // ترجمة بيانات العنصر المحدد في الشريط السفلي (HUD)
    const hudDims = document.getElementById('hudItemDims');
    if (hudDims && hudDims.textContent) {
      if (en) {
        hudDims.textContent = hudDims.textContent
          .replace(/يمين:/g, 'Right:')
          .replace(/شمال:/g, 'Left:')
          .replace(/أرض:/g, 'Floor:')
          .replace(/مقاس:/g, 'Size:')
          .replace(/سقوط:/g, 'Drop:')
          .replace(/عرض:/g, 'Width:')
          .replace(/سم/g, 'cm');
      }
    }
  }

  // =========================================================================
  // 6. ربط كل التحديثات مع دورة حياة التطبيق (syncUI & renderCanvas)
  // =========================================================================
  const _prevRenderElevation = drawRealisticElevationView;
  drawRealisticElevationView = function (ctx, W, H) {
    const w = state.walls[state.activeWallIndex];
    const savedCeil = state.ceilingHeight;
    if (w) {
      // رسم واجهة الحائط الحالي بارتفاعه المخصص المستقل
      state.ceilingHeight = window.getWallHeightCm(w);
    }
    try {
      _prevRenderElevation.call(this, ctx, W, H);
    } finally {
      state.ceilingHeight = savedCeil;
    }
  };

  const _prevRenderCanvas = renderCanvas;
  renderCanvas = function () {
    _prevRenderCanvas.apply(this, arguments);
    try {
      const ctx = cv.getContext('2d');
      drawSmartPlanEnhancements(ctx, cv.width, cv.height);
    } catch (e) {}
  };

  const _prevSyncUI = syncUI;
  syncUI = function () {
    upgradeHeaderAndMenus();
    _prevSyncUI.apply(this, arguments);
    syncWallHeightUI();
    applyFullDomTranslation();
    renderCanvas();
  };

  // تفعيل فوري عند التحميل وعند تبديل اللغة
  window.addEventListener('load', () => {
    upgradeHeaderAndMenus();
    syncUI();
  });
  document.getElementById('btnLangEn')?.addEventListener('click', () => setTimeout(syncUI, 20));
  document.getElementById('btnLangAr')?.addEventListener('click', () => setTimeout(syncUI, 20));

  upgradeHeaderAndMenus();
  syncUI();
})();
</script>
